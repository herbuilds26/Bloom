name: bloom
description: A private, thoughtful period and wellness tracker.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_app_check: ^0.3.2+4
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0
  fl_chart: ^0.71.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  csv: ^6.0.0
  pdf: ^3.11.3
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  generate: true
